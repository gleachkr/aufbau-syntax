name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # Node runs the release check and the smoke test. The smoke test is the
      # point: the published artifact must load in a runtime that is not Bun.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the release version
        run: node scripts/check-version.mjs

      - name: Run the full suite
        run: bun run validate

      - name: Build the package
        run: bun run build

      - name: Smoke-test the built package in Node
        run: node scripts/smoke.mjs

      - name: Check what would be published
        run: |
          npm pack --dry-run --ignore-scripts --json \
            > "${RUNNER_TEMP}/pack.json"
          node -e '
            const assert = require("node:assert/strict");
            const [pack] = require(`${process.env.RUNNER_TEMP}/pack.json`);
            const files = pack.files.map((f) => f.path);

            for (const wanted of [
              "dist/index.js",
              "dist/index.d.ts",
              "LICENSE",
              "README.md",
            ]) {
              assert.ok(
                files.includes(wanted),
                `the tarball is missing ${wanted}`,
              );
            }

            // Code only. The specs in this repository are examples and
            // fixtures — an application owns the specs it teaches from,
            // and must not be able to reach for one of ours by accident.
            const stray = files.filter(
              (f) =>
                f.startsWith("src/") ||
                f.startsWith("tests/") ||
                f.startsWith("specs/"),
            );
            assert.deepEqual(
              stray,
              [],
              "sources, tests, and specs must not ship",
            );

            console.log(`Tarball carries ${files.length} files.`);
          '
